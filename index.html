<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mon Script Brut</title>
  <style>
    body {
      background-color: #111;
      color: #0f0;
      font-family: monospace;
      white-space: pre-wrap;
      padding: 20px;
    }
  </style>
</head>
<body>
<pre id="code">
// Ton script sera chargé ici automatiquement
Chargement...
</pre>

<script>
  // Charge le contenu depuis un fichier texte brut hébergé dans le projet
  fetch('mon_script.lua')
    .then(response => response.text())
    .then(text => {
      document.getElementById('code').textContent = text;
    })
    .catch(error => {
      document.getElementById('code').textContent = "Erreur de chargement : " + error;
    });
</script>
</body>
</html>
